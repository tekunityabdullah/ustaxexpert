          - paragraph [ref=f113e29]: 4-Phase Generator Device With 4-Phase Eccentric Mass Load Systems
          - generic [ref=f113e30]:
            - heading "Cross Reference to Related Applications" [level=2] [ref=f113e31]
            - paragraph [ref=f113e32]: "[1] The present application is a Continuation-In-Part of Patent Application 18/301,764, Which was filed on April 17, 2023, and which claims priority to, and the benefits of, U.S."
            - paragraph [ref=f113e33]: Provisional Application No, 63/419,373, which was filed on October 26, 2022, and is incorporated herein by reference in its entirety. and United States Patent Navarro 5,473,957. United States Patent Navarro 5,150,626.
          - generic [ref=f113e34]:
            - heading "Field of the Invention" [level=2] [ref=f113e35]
            - paragraph [ref=f113e36]: "[2] The present invention relates generally to the field of electric generators. More specifically, the present invention, in one embodiment, relates to a novel 4-phase electric generator and eccentric mass load subsystems. The device features a stator wall with eight stator slots and four pole groups, enabling the generation of electrical energy with increased efficiency compared to conventional generators. These generators provide 8 output voltages, and the current provides electric power for the dual eccentric mass load systems. Accordingly, the present disclosure makes specific reference thereto. Nonetheless, it is to be appreciated that aspects of the present invention are also equally applicable to others, like applications, devices, and methods of manufacturing."
            - paragraph [ref=f113e37]: "[3] The subject matter disclosed and claimed herein, in one embodiment thereof, comprises 4-phase generator and eccentric mass load subsystems. The device further comprising a stator wall having a circular or cylindrical shape, eight stator slots disposed in the stator wall, the eight stator slots are divided into four pole groups of two opposing stator slots, each slot of the two opposing stator slots are connected via coils, the coils also connects to an output and to a neutral point, one slot of the two opposing stator slots having North polarity (N stator slot) and the other slot having South polarity (S stator slot), four of the stator slots on one side of the stator wall correspond to the other four of the stator slots on an opposing side of the stator wall, a permanent magnetic (four North Poles and four South poles) armature, and the device is further configured to alternate activation between N stator slots and S stator slots of the four pole groups in response to rotation of the armature, wherein eight poles are actively coupled in any given configuration and permanent magnetic material with North and South polarities."
          - generic [ref=f113e38]:
            - heading "Summary of the Invention" [level=2] [ref=f113e39]
            - paragraph [ref=f113e40]: "[4] The following presents a simplified summary to provide a basic understanding of some aspects of the disclosed innovation. This summary is not an extensive overview, and it is not intended to identify key/critical elements or to delineate the scope thereof. Its sole purpose is to present some general concepts in a simplified form as a prelude to the more detailed description that is presented later."
            - paragraph [ref=f113e41]: "[5] The subject matter disclosed and claimed herein, in one embodiment thereof, comprises of 4-phase generator and eccentric mass load subsystems. The device further comprising a stator wall having a circular or cylindrical shape, eight stator slots disposed in the stator wall, the eight stator slots are divided into eight groups of two opposing stator slots, one slot of the two opposing stator slots having North polarity and the other slot having South polarity, the eight groups forming the four eight groups, wherein four of the stator slots on one side of the stator wall correspond to the other four of the stator slots on an opposing side of the stator wall, a permanent magnetic material armature with four north poles and four south poles opposite each other, and the device is further configured to alternate activation between N stator slots and S stator slots of the eight pole groups in response to rotation of the armature, wherein eight poles are actively coupled in any given configuration."
            - paragraph [ref=f113e42]: "[6] The subject matter disclosed and claimed herein, in one embodiment thereof, comprises a method of operating a 4-Phase Generator and eccentric load mass subsystems. The method comprising the steps of rotating an armature along a stator wall, the stator wall having a circular or cylindrical shape, eight stator slots divided into eight pole groups, each pole group has a N stator slot and a S stator slot, wherein four of the stator slots on one side of the stator wall correspond to the other four of the stator slots on an opposing side of the stator wall; alternating activation between N stator slots and S stator slots of the four pole groups in response to the rotation of the armature, wherein eight poles are actively coupled in any given configuration."
            - paragraph [ref=f113e43]: "[7] The activation of the pole groups results in magnetic fields within the stator wall."
            - paragraph [ref=f113e44]: "[8] In another aspect of the present invention, the stator slots are arranged in a symmetrical pattern around the stator wall."
            - paragraph [ref=f113e45]: "[9] The stator wall is made of magnetic iron lamination material with copper coils output and ground neutral connections."
          - generic [ref=f113e46]:
            - heading "Supersymmetric Rotors — Breaking the Rules of Physics" [level=2] [ref=f113e47]
            - paragraph [ref=f113e48]: "[10] A 4-phase eccentric mass load subsystem, a stator wall and armatures are disclosed. The stator wall having eight phases of functional operation and a circular or cylindrical shape with eight stator slots divided into four pole groups, each pole group having a N stator pole and a S stator pole, an eccentric load mass diagram, including eccentric load, located at specific distances from the center axis of rotation of the stator wall, wherein the subsystems of eccentric load or rotor mass diagram enables the generator to operate efficiently and generate power while compensating for the eccentric load masses subsystems."
            - paragraph [ref=f113e49]: "[11] The 4-phase motor and generator device of the present invention is easily and efficiently manufactured, marketed, and available to consumers in a cost-effective manner. It is easily used by users for generating power in numerous ways, like powering eccentric load subsystems these systems can be used in the HIGGS Field in outer space for Satellite Maintenance, Space Junk problems, Asteroid Mining, and assisting with moving payloads from the moon of Helium 3 back to Earth."
            - paragraph [ref=f113e50]: "[12] The 4-Phase Generator has eight outputs of current. That provides input power for the 4-Phase stator wall from the armature's permanent magnetic poles for rotation inside its stator wall with electrical conductor segments from a control panel, with the Lithium battery bank support. The output from the 4-Phase Generator has a voltage regulator to stop charging the Lithium batteries. Solar Panels will be used in systems that operate in outer space, and charge the Lithium batteries, with voltage regulator controls in the control panel can resume charging the Lithium batteries when required to provide power from the Lithium battery bank for the 4-Phase Armatures and stator wall from eight of the outputs of the 4-Phase Generator. Also included is the Solar Panel distribution arrangement."
