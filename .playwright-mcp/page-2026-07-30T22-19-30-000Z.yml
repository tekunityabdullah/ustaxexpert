            - paragraph [ref=f113e77]: The invention relates to a novel 4-phase motor and generator device with increased efficiency for generating electrical energy. The device features a stator wall with eight stator slots and four pole groups, and an armature of permanent magnetic material with four north poles and four south poles, rotatable within the stator wall. The permanent magnetic armatures rotating the magnetic field within the stator wall, resulting in eight direct currents outputs. Solar powered panel system will provide power for the Lithium battery bank the will provide the power for the direct current motor that rotates the permanent magnetic armature and as the eight pole permanent magnetic armature fields inside the eight-pole stator wall current will be induced into the eight-pole stator wall for direct current output power to a control panel for power distribution to other devices within this patent application as defined in the drawings and claims.
