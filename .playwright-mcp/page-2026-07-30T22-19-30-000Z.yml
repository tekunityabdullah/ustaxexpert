          - generic [ref=f113e68]:
            - heading "Claims of the Invention" [level=2] [ref=f113e69]
            - paragraph [ref=f113e70]: "[55] The present invention, in one exemplary embodiment, is a method of operating 4-Phase Generator and eccentric mass load subsystems. A solar powered panel system will provide power for the Lithium battery bank will provide the electric power, to rotate the current to the direct current motor, to provide a method of rotating permanent magnetic armature with four north poles and 4 south poles inside a stator wall, the stator wall having a circular or cylindrical shape, with eight stator slots divided into four pole groups, each pole group has a N stator slot and a S stator slot, wherein four of the stator slots on one side of the stator wall correspond to the other four of the stator slots on an opposing side of the stator wall as described in the drawings. The permanent magnetic armature will generate eight outputs of power from the Stator wall to the control panel."
            - paragraph [ref=f113e71]: "[56] This will provide electric power for two systems each containing four armatures, each armature has eight poles two A poles, two B poles, two C poles, two D poles opposite each other. These four armatures are inside an eight-pole stator wall, as a result the stator wall eight stator slots also have two A magnetic slots, two B magnetic slots, two C magnetic slots and two D magnetic slots that receive their power for the Lithium battery bank regulated from the Control panel."
            - paragraph [ref=f113e72]: "[57] The armatures inside the stator wall will have an eccentric mass load on each armature that is mechanically attached to each armature, as illustrated in the drawings."
            - paragraph [ref=f113e73]: "[58] As described in the drawings, one eccentric mass load system will rotate clockwise, and the other eccentric mass load system will rotate counterclockwise. These eccentric mass load systems will be mounted on decks and a timing gear will keep the synchronized to distribute the eccentric mass load in one direction that is constant as defined in the drawings."
            - paragraph [ref=f113e74]: "[59] This application of eccentric load mass systems presents unique technical objectives and challenges, fundamentally altering the dynamics of current angular momentum conservation laws. In systems with eccentric mass load configurations, the distribution of mass around the axis of rotation is non-uniform, leading to deviations from traditional Conservation Laws Principles. The result is the eccentric mass load systems of the 4-Phase Motor Generator Device move in a direction that is constant where the mass is furthest out from the center axis of rotation, in the direction of Earth's gravitational field, and/or in HIGGS Fields in outer space."
