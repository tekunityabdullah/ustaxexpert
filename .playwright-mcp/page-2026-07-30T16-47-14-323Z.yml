    - generic [ref=f34e30]:
      - generic [ref=f34e31]:
        - heading "About Me" [level=2] [ref=f34e32]
        - heading "I'm Martina Davies, And I'm So Glad You're Here At Travel-Madly!" [level=3] [ref=f34e33]
        - paragraph [ref=f34e34]: I know what it's like to dream of travel but not know where to start. I grew up in a small Texas suburb, surrounded by a big, loving family. For us, travel meant weekend road trips and family reunions, not international adventures. That changed when I met my husband Phillip, a proud Welshman with a love for the open world.
        - list [ref=f34e35]:
          - listitem [ref=f34e36]:
            - generic [ref=f34e37]: "1"
            - generic [ref=f34e38]:
              - strong [ref=f34e39]: Custom Plans
              - text: We create travel plans that match your interests, budget, and the way you like to explore.
          - listitem [ref=f34e40]:
            - generic [ref=f34e41]: "2"
            - generic [ref=f34e42]:
              - strong [ref=f34e43]: Easy Booking
              - text: From hotels to excursions, everything is planned for you so there's nothing to worry about.
          - listitem [ref=f34e44]:
            - generic [ref=f34e45]: "3"
            - generic [ref=f34e46]:
              - strong [ref=f34e47]: Trusted Partners
              - text: We partner with top travel experts to deliver seamless planning and unforgettable journeys.
          - listitem [ref=f34e48]:
