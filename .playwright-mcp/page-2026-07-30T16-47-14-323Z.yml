      - heading "Travel Madly. Live Fully. It's Time." [level=1] [ref=f34e26]
      - paragraph [ref=f34e27]: Travel-Madly turns trip planning into a breeze—fun, fearless, and fabulously easy! With trusted service, thrilling options, and personal travel support that makes you feel like a VIP. We strive to make your journey seamless, stress-free and packed with memory making adventures.
