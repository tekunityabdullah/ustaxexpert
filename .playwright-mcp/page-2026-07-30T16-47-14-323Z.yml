      - generic [ref=f34e118]:
        - generic [ref=f34e120]:
          - generic [ref=f34e122]:
            - heading "Rick A" [level=3] [ref=f34e123]
            - generic "5 out of 5 stars" [ref=f34e124]
            - paragraph [ref=f34e136]: Our family vacation to Galveston in July was wonderful! The beachfront hotel was in the perfect location—close to everything, with beach views that made our stay even more special. Everything was arranged so smoothly that traveling with my children and grandson was completely stress-free. Travel-Madly even sent me links to explore and choose activities at my own pace, which was so convenient. Thanks to Travel-Madly, all we had to do was relax, enjoy the beach, and make unforgettable memories together.
            - img "Rick A" [ref=f34e138]
          - generic [ref=f34e140]:
            - heading "Phill D" [level=3] [ref=f34e141]
            - generic "5 out of 5 stars" [ref=f34e142]
            - paragraph [ref=f34e154]: Our family cruise to the Caribbean was incredible, and Martina at Travel-Madly made it completely stress-free. She handled everything—tickets, excursions, and great activity recommendations. Top-notch service from start to finish. Definitely a 5-star experience! We will definitely be using them again.
            - img "Phill D" [ref=f34e156]
          - generic [ref=f34e158]:
            - heading "Will T" [level=3] [ref=f34e159]
            - generic "5 out of 5 stars" [ref=f34e160]
            - paragraph [ref=f34e172]: We've worked with Martina at Travel-Madly a couple of times now, and she always delivers. She got my mom a great deal on flights and hotel for my cousin's wedding in Philadelphia this past June, and more recently helped us with our August cruise. Even though we had already booked the cruise ourselves, she still came through with excellent excursion deals, parking recommendations, and even made sure my mom was covered with travel insurance. The service from Martina and her team has been top-notch, and we'll definitely keep using Travel-Madly for all our future trips.
            - img "Will T" [ref=f34e174]
          - generic [ref=f34e176]:
            - heading "Mary M" [level=3] [ref=f34e177]
            - generic "5 out of 5 stars" [ref=f34e178]
            - generic [ref=f34e189]:
              - paragraph [ref=f34e190]: We had the absolute best experience working with Martina Davies to plan our Caribbean cruise with Carnival! From start to finish, Martina made everything so easy — from booking the cruise to organizing our amazing excursions in Costa Maya, Belize, and Cancun. Her attention to detail, friendly guidance, and expert recommendations helped us create an unforgettable trip filled with wonderful memories. Every part of our journey ran smoothly, and we could truly relax and enjoy every moment knowing everything was taken care of.
              - paragraph [ref=f34e191]: If you're thinking about booking a cruise, I can't recommend Martina Davies highly enough! She made the entire process seamless, and thanks to her, we had a fantastic time exploring the Caribbean.
            - img "Mary M" [ref=f34e193]
          - generic [ref=f34e195]:
            - heading "Teresa V." [level=3] [ref=f34e196]
            - generic "5 out of 5 stars" [ref=f34e197]
            - paragraph [ref=f34e209]: I was a first-time cruiser and felt a little nervous at first, but Martina put me completely at ease. She took care of everything and patiently answered all of my questions. I sailed on the Carnival Dream, and once I was onboard, all my worries disappeared—it turned out to be one of the best vacations I've ever had! The excursions Martina recommended were fantastic and exceeded my expectations. Thanks to her guidance, I enjoyed six days of total relaxation and fun without a single worry. I'm already looking forward to planning my next cruise with Travel-Madly!
            - img "Teresa V." [ref=f34e211]
          - generic [ref=f34e213]:
            - heading "Stefani R" [level=3] [ref=f34e214]
            - generic "5 out of 5 stars" [ref=f34e215]
            - generic [ref=f34e226]:
              - paragraph [ref=f34e227]: Booked my very first cruise with Travel-Madly, and it was everything I hoped for and more! We sailed on the Carnival Liberty out of New Orleans with stops in Jamaica, Grand Cayman, and Cozumel.
              - paragraph [ref=f34e228]: Martina not only found us a fantastic deal with Carnival, but she also provided great recommendations for excursions outside of the cruise line options. Her friendly reminders about important deadlines, check-in details, and first-time cruiser tips made the whole experience stress-free.
              - paragraph [ref=f34e229]: We had such an amazing time and will definitely be booking another cruise—and without a doubt, we'll be using Travel-Madly again. Thank you, Martina & Travel-Madly, for making our trip so unforgettable!
            - img "Stefani R" [ref=f34e231]
          - generic [ref=f34e233]:
            - heading "Cruz A" [level=3] [ref=f34e234]
            - generic "5 out of 5 stars" [ref=f34e235]
            - generic [ref=f34e246]:
              - paragraph [ref=f34e247]: We booked our most recent cruise with Travel-Madly. The cruise started in Galveston and stopped in Costa Maya, Belize, and Cozumel. I'm not the best planner so I appreciated the reminders she sent us about key deadlines and check-in details. It was the smoothest cruise experience I've ever had. This was my 10th cruise so that's saying a lot!
              - paragraph [ref=f34e248]: Martina went well beyond the call of duty for us! She found us an AirBnB for the night before departure, a parking venue for the week, and booked all our excursions for us. If you have ever been on a cruise, you know what a painful experience it is to do all this yourself! We are so blown away by the world class service we received, and we're already working with Travel-Madly to book our next cruise on the Sky Princes departing out of Orlando!
              - paragraph [ref=f34e249]: A big thanks to Martina and the Travel-Madly team for making our vacation so stress free!
            - img "Cruz A" [ref=f34e251]
