                  - text: 0.1 meters (about 4 inches) from the center axis.
                - listitem [ref=f102e231]:
                  - strong [ref=f102e232]: "Rotational Speed:"
                  - text: 6,000 RPM (a typical speed for high-performance DC motors mentioned on the site).
              - list [ref=f102e233]:
                - listitem [ref=f102e234]:
                  - strong [ref=f102e235]: Centrifugal Force Calculation
              - paragraph [ref=f102e236]: "Using the formula 𝐹c = m · w² · r, where w is the angular velocity in radians per second:"
              - list [ref=f102e237]:
