                    - cell "~200" [ref=f102e448]
                    - cell [ref=f102e449]:
                      - strong [ref=f102e450]: "Yes"
                      - text: ", very comfortable."
                  - row [ref=f102e451]:
                    - cell [ref=f102e452]:
                      - strong [ref=f102e453]: Carbon Fiber (IM7)
                    - cell "~1,400+" [ref=f102e454]
                    - cell [ref=f102e455]:
