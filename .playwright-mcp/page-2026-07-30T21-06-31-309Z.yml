              - paragraph [ref=f102e208]:
                - text: The core challenge in propulsion theory—and where the
                - strong [ref=f102e209]: Higgs Field
                - text: enters the discussion on
                - link "supersymmetry.com" [ref=f102e210] [cursor=pointer]:
                  - /url: http://supersymmetry.com/
                - text: —is how to prevent that massive force from simply pulling the device back the other way 180 degrees later. In standard physics, these forces cancel out over a full rotation, resulting in zero net movement (vibration only).
              - paragraph [ref=f102e211]: The claim here is that the asymmetry and the interaction with the Higgs Field allow the system to “keep” a portion of that forward momentum while “negating” the backward pull.
              - paragraph [ref=f102e212]:
                - strong [ref=f102e213]: What specific mass and RPM values would you like to plug in? We could also calculate the electrical wattage required to maintain that velocity against the inertia.
              - paragraph [ref=f102e214]:
                - text: To illustrate the energy and force involved in the
                - strong [ref=f102e215]: Supersymmetric Rotor
                - text: concept, let’s use values that are representative of the 65-pound prototype featured on the
                - link "supersymmetry.com" [ref=f102e216] [cursor=pointer]:
                  - /url: http://supersymmetry.com/
                - text: website.
              - paragraph [ref=f102e217]: By plugging in a set of “high-performance” parameters, we can see exactly how much force is acting on the system’s axis and the electrical power required to sustain it.
              - list [ref=f102e218]:
                - listitem [ref=f102e219]:
                  - strong [ref=f102e220]: The Physical Parameters
              - paragraph [ref=f102e221]: "For this calculation, we will assume a high-speed setup:"
              - list [ref=f102e222]:
                - listitem [ref=f102e223]:
                  - strong [ref=f102e224]: Eccentric Mass (
                  - strong [ref=f102e225]: m
                  - strong [ref=f102e226]: "):"
                  - text: 1 kg (about 2.2 lbs.) for each of the two counter-rotating loads.
                - listitem [ref=f102e227]:
