                  - strong [ref=f102e341]: The G-Force Calculation
              - paragraph [ref=f102e342]:
                - text: The formula for centripetal acceleration (
                - strong [ref=f102e343]: 𝓪
                - text: "𝑐) is:"
              - paragraph [ref=f102e344]:
                - strong [ref=f102e345]: 𝓪
                - text: 𝑐 = 𝟂² ⋅ 𝙧
              - paragraph [ref=f102e346]: "Using our previous value for (1,047.2 rad/s):"
              - paragraph [ref=f102e347]: 𝓪𝑐 = (1,047.2)² ⋅ 0.1 ≈ 109,663 m/s²
              - paragraph [ref=f102e348]:
                - text: To find the
                - strong [ref=f102e349]: G-force
                - text: ", we divide by standard gravity (9.81 m/s²):"
              - paragraph [ref=f102e350]:
                - text: G-force = 109,666 ≈
                - strong [ref=f102e351]: 11,178
                - text: Gs’
              - paragraph [ref=f102e352]: "9.81"
              - list [ref=f102e353]:
                - listitem [ref=f102e354]:
                  - strong [ref=f102e355]: Material Strength vs. Centrifugal Stress
              - paragraph [ref=f102e356]:
                - text: At over
                - strong [ref=f102e357]: 11,000 Gs
                - text: ", a 1 kg mass “weighs” the equivalent of 11,000 kg (about 12 tons) as it pulls away from the center axis. This creates immense"
                - strong [ref=f102e358]: tensile stress
                - text: on the rotor arm.
