          - heading "Symmetry vs Asymmetry — Emmy Noether’s Law" [level=2] [ref=f109e33]
          - paragraph [ref=f109e34]: "[26] In the drawing of FIG. 4, the result of variable adjusting the rotation per minute of the multiple parallel eccentric load mass 33. System 10 will move in a direction that is constant, as 33 eccentric mass loads display an arrow of the direction of movement of system 10. See details of eccentric mass loads in the drawings of FIG.6 and the FIG.7 sequence of operation."
          - paragraph [ref=f109e35]: "[27] In the embodiment of the controlled translational force generating system 10 illustrated in drawing of FIG.4, the main frame 12 includes a plurality of upper, middle, and lower horizontal platforms 18, 20, 22 and a plurality of vertical legs 24 supporting platforms 18, 20, 22 in vertically spaced relation."
          - paragraph [ref=f109e36]: "[28] Each parallel eccentric mass load systems inside each of eccentric load mass sub systems 14 which is illustrated in drawings of FIGS. 4, 5, 6, and 7, are substantially the same in construction and operations as the electromagnetic implementation of the translational force-generating apparatus illustrated and described in U.S. Pat. Navarro No. 5,150,626, and U.S. Pat. No. Navarro 5,473,957, the disclosure of which is incorporated herein by reference."
          - paragraph [ref=f109e37]: "[29] Referring to drawings in FIGS. 4, 6, and 7, each of the parallel eccentric mass load subsystems 14 of the controlled translational force-generating systems 10 which generate the respective initial translational forces includes an auxiliary frame 26, a rotary drive motor 28, an orbital frames 14, a plurality of orbital members 32 with multiple eccentric mass loads 33. The counter-rotational relationship of the respective components of the one subsystem 14 relative to the corresponding components of the other subsystem 14 and the parallel relationship of the central rotational axes C of the subsystem 14 are the features of the system 10 responsible for causing the generally straight-line motion orientation of the combined translational force which results from the initial translational force generated by the combined operation of the subsystems 14."
          - paragraph [ref=f109e38]: "[30] Referring again to the drawing of FIG.4, each of the parallel direct current motors 36 has a center shaft 36A on FIG.1; the permanent magnet armature 108 center axis shaft is mechanically coupled to this shaft 36A. The rectangular box 38 displays the contents of the Drawings of FIG. 1, the 4-Phase Generator with eight outputs resides in both of 38 rectangular boxes illustrations on the drawings of FIG.4."
          - paragraph [ref=f109e39]: "[31] Referring to drawings of FIG.4, the controlled translational force generating system 10 also includes synchronizing means 42 in the form of a pair of large timing gears 44, which are mounted in the same horizontal plane, have the same diameters and peripherally with one another, are connected to lower ends of the respective orbital frames 14 through lower center axis shaft 28A."
          - paragraph [ref=f109e40]: "[32] In drawing FIG.4 subsystems 14 represent FIG.2 and FIG.3 of one system going clockwise in rotation and the other rotating counterclockwise, and the purpose of this sequence is to obtain straight direction motion of the system in a direction that is constant, from the effects of the eccentric mass loads."
          - paragraph [ref=f109e41]: "[33] In drawing FIG.4, item 40 is the Control Panel that connects the wiring to items 36, item see FIG.1 and for wiring of motors 38, item 28 as the motors that rotate their center axis in FIG.2 and FIG.3."
          - paragraph [ref=f109e42]: "[34] For the present disclosure, Eccentric loads mass G, H, I, and J drawings FIG.6 and FIG.7 display the locations of the eccentric mass loads as they rotate about the center axis of rotation distances from the center axis E and F."
          - paragraph [ref=f109e43]: "[35] Referring initially to the drawings, FIG.1 illustrates an internal view of one potential embodiment of a 4-phase generator of one potential embodiment of the present invention by the disclosed architecture. The machine 100 includes a stator wall 102 and an armature 108. The stator wall 102 features eight outputs of power."
          - paragraph [ref=f109e44]: "[36] The drawing of FIG. 1 displays the four pole groups configured on stator wall 102, and each pole group includes a pair of corresponding stator slots on opposing sides of stator wall 102. During use, the rotation of the permanent magnetic armature 108 causes the four pole groups to alternate in activation between N stator slots and S stator slots, generating an electrical current with 8 outputs."
          - paragraph [ref=f109e45]: "[37] Stator wall 102 is preferably made of magnetic material, and the activation of the pole groups results in the magnetic field of the stator wall. The armature 108 functions as a rotor and includes a plurality of permanent magnetic poles positioned at the center of the stator wall 102 with opposite 4 North and 4 South Polarities."
          - paragraph [ref=f109e46]: "[38] Generator 100 of the present invention is a 4-phase generator formed of four pole groups alternating between N stator slots and S stator slots, thereby generating electrical energy outputs."
          - paragraph [ref=f109e47]: "[39] In drawing FIG.1 for each pair of opposing stator slots, a coil is connected to opposing stator slots wherein the coil extends from outputs 1 through 8 and connects to the terminals at neutral point 112."
          - paragraph [ref=f109e48]: "[40] In drawing, FIG.2 Phase A is formed by opposing stator slots 106a and 106e, Phase B by 106b and 106f, Phase C by 106c and 106g, and Phase D by 106d and 106h."
          - paragraph [ref=f109e49]: "[41] FIG.6 illustrates the eccentric load mass diagram for the functioning of the 4-phase motor and generator device. The diagram illustrates the relationship between the stator wall and the eccentric load masses mounted on the armatures."
          - paragraph [ref=f109e50]: "[42] In drawing of FIG. 6, the eccentric load mass is indicated by the letter “G,” located at a distance ”E1″ from the center axis of rotation “O”. The eccentric load mass indicated by “I” is located at a distance “F1″ from the center axis of rotation “O”."
          - paragraph [ref=f109e51]: "[43] In the drawing of FIG.6 in Circle 304, the eccentric load mass “G” and “J” are both located at a distance “E2” from the center axis of rotation “O”, while “I” and “H” are located at a distance “F2”."
          - paragraph [ref=f109e52]: "[44] In the drawing of FIG.6 In Circle 308, the eccentric load mass “I” and “J” are both located at a distance “E4″ from the center axis of rotation “O”, while “H” and “G” are located at a distance “F4”."
          - paragraph [ref=f109e53]: "[45] FIG. 7 illustrates Eccentric load or rotor mass Diagram 400, and displays the relationship between the 4-phase stator wall and eccentric load or rotor masses."
          - paragraph [ref=f109e54]: "[46] This cycle now repeats Eccentric load or mass Diagram 300 then Eccentric load mass Diagram 400 and so on. The alternating pattern of the eccentric load masses in the two diagrams helps maximize the force of system “10” to move in a constant direction toward the eccentric mass loads' greatest distance from center axis “0”."
          - paragraph [ref=f109e55]: "[47] The drawing of FIG. 5 illustrates the four armatures' electromagnetic functions inside the stator wall that provide the means for the eccentric load mass to rotate inside the stator wall. The revolutions per minute of the center axis of rotation shall be increased or decreased to maximize or minimize the effects of the eccentric mass load upon the center axis of rotation for translational force generation to move the system in a direction that is constant."
          - paragraph [ref=f109e56]: "[48] Each of these systems can be one in front of the other so that the eccentric load mass is always peaking at the “A” phase to control the effects of the eccentric mass loads upon the center axis of rotation O, resulting in the systems moving in the direction of greatest distance of eccentric mass loads J, G, H, and I."
          - paragraph [ref=f109e57]: "[49] In the drawing of FIG.4, the armature coils can be soldered to the top and bottom of a copper communications ring. From the brushes, a conductor segment is wired to a control panel, which regulates the voltage and current from the Lithium battery bank or Solar Panels."
          - paragraph [ref=f109e58]: "[50] The 4-Phase Motor Generator figures, in the drawings of FIG. 6 and FIG. 7, display the location of the eccentric mass loads as they revolve about their center axis of rotation. These eccentric mass loads (labeled G, H, I, and J) are identical load mass."
          - paragraph [ref=f109e59]: "[51] In the drawing of FIG.4, one eccentric mass load system revolves clockwise, and the other revolves counterclockwise about its center axis of rotation, resulting in this system moving in a direction that is constant in the Earth's gravitational field or in the Higgs Field in Outer Space."
          - paragraph [ref=f109e60]: "[52] In contrast, the present disclosure includes an eccentric mass load system having 4 eccentric mass loads revolving clockwise about its center axis of rotation and another 4 eccentric mass loads revolving counterclockwise about its center axis of rotation, resulting in a system that moves in a constant direction."
          - paragraph [ref=f109e61]: "[53] As used herein, “4-phase motor and generator device”, “4-phase generator”, “generator”, and “4-phase generator and eccentric mass load systems” are interchangeable and refer to the 4-phase and generator and eccentric mass load systems, 100 of the present invention."
          - paragraph [ref=f109e62]: "[54] The 4-phase generator and eccentric mass load systems can be of any suitable size and configuration as is known in art without affecting the overall concept of the invention if it accomplishes the above-stated objectives."
