          - paragraph [ref=f109e31]: The next 2nd drawing in the center of the page on the top is X=X is symmetry, Amplitude and frequency are equal symmetrical operation, below drawing is X>Y where X is a greater distance than Y thus Amplitude and frequency are not equal, and this is a Asymmetrical operation.
